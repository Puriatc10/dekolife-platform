name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  # Every `docker compose` call in this workflow uses the CI overlay (no bind mounts).
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

# Least privilege, but explicit: the gitleaks action calls the pull-request API to learn
# the PR base/head SHAs. Without `pull-requests: read` the default token answers
# "Resource not accessible by integration" and the secret scan fails on every PR (it
# passes on push, which is how this went unnoticed for one commit).
permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend (Pint · PHPStan · Pest on MySQL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The gates run inside the same container developers use, against the same MySQL
      # image and hostname as compose.yaml. Running Pint/PHPStan/Pest on the bare runner
      # is faster but proves a different stack than the one we ship, and a hostname
      # mismatch (mysql vs 127.0.0.1) would only surface after delivery.
      - name: Build application image
        # public.ecr.aws answers 429 under load from shared CI runners (seen once on main
        # after a green PR). A base-image pull failure is infrastructure, not a code
        # defect, so the build retries with backoff instead of failing the pipeline.
        run: |
          for attempt in 1 2 3; do
            if docker compose build app; then
              echo "image built on attempt ${attempt}"
              exit 0
            fi
            echo "build attempt ${attempt} failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "image build failed after 3 attempts"
          exit 1

      - name: Start MySQL and mail catcher
        run: docker compose up -d mysql mailpit

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T mysql mysqladmin ping -h127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then
              echo "MySQL ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"
          docker compose logs mysql
          exit 1

      - name: Ensure the test database exists and is granted
        run: |
          docker compose exec -T mysql mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS dekolife_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON dekolife_test.* TO 'dekolife'@'%'; FLUSH PRIVILEGES;"

      - name: Composer validate
        run: docker compose run --rm --no-deps app composer validate --strict --no-check-publish

      - name: Code style (Pint)
        run: docker compose run --rm --no-deps app ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: docker compose run --rm --no-deps app ./vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Tests (Pest on MySQL)
        # A container has no `.env` (deliberately: secrets never ship in the image), and
        # phpdotenv warns on a missing file, which Pest reports as a test warning. The
        # test credentials come from phpunit.xml; this only silences the file read.
        run: docker compose run --rm --no-deps app sh -c 'cp .env.example .env && php artisan test --colors=never'

      - name: Dependency audit
        run: docker compose run --rm --no-deps app composer audit --no-interaction

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
