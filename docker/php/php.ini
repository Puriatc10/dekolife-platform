; Application PHP settings for the Dekolife web container.
; Values are intentionally development-friendly; production overrides belong in
; the deployment topology document (docs/architecture/deployment-topology.md).

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60

date.timezone = UTC
default_charset = "UTF-8"

; Never expose stack traces or PHP errors to the browser in production.
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

session.gc_maxlifetime = 7200
