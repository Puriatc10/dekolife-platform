# Local development stack for Dekolife.
#
#   docker compose up -d          # app (php-fpm), nginx :8080, mysql :3307, mailpit :8025
#   docker compose exec app php artisan migrate --seed
#   docker compose exec app php artisan test
#
# Base images come from the public ECR mirror of Docker Official Images so that a
# host whose Docker Hub access is blocked resolves the same tags as CI. Override
# with PHP_IMAGE / MYSQL_IMAGE environment variables if needed.

name: dekolife

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
      args:
        PHP_IMAGE: ${PHP_IMAGE:-public.ecr.aws/docker/library/php:8.4-fpm}
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-public.ecr.aws/docker/library/composer:2}
        INSTALL_DEV: "true"
    image: dekolife/app:local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-dekolife}
      DB_USERNAME: ${DB_USERNAME:-dekolife}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [dekolife]

  queue:
    image: dekolife/app:local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=1"]
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-dekolife}
      DB_USERNAME: ${DB_USERNAME:-dekolife}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy
    networks: [dekolife]

  nginx:
    image: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:alpine}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [dekolife]

  mysql:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dekolife}
      MYSQL_USER: ${DB_USERNAME:-dekolife}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [dekolife]

  mailpit:
    # ghcr.io, not Docker Hub: hub access is blocked on some development hosts.
    image: ${MAILPIT_IMAGE:-ghcr.io/axllent/mailpit:latest}
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [dekolife]

networks:
  dekolife:
    driver: bridge

volumes:
  mysql-data:
